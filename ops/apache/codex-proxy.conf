# Include this path BEFORE the catch-all ProxyPass "/" in the CRM HTTPS vhost.
# The proxy still requires CODEX_PROXY_API_KEY at the application layer.
ProxyPass "/internal/codex-proxy/v1/" "http://172.17.0.1:8646/v1/" connectiontimeout=5 timeout=300
ProxyPassReverse "/internal/codex-proxy/v1/" "http://172.17.0.1:8646/v1/"
